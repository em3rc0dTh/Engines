extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: engines-platform-observer-otel
          scrape_interval: 2s
          static_configs:
            - targets: ["platform-observer:8890"]

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [debug]
