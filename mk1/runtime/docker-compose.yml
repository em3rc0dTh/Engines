services:
  postgres:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_USER: engines
      POSTGRES_PASSWORD: engines
      POSTGRES_DB: engines_mk0
    volumes:
      - engines_mk0_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engines -d engines_mk0"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.29
    volumes:
      - engines_mk0_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  temporal:
    build:
      context: .
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 3s

  migrate:
    build:
      context: .
    environment:
      POSTGRES_URL: postgresql://engines:engines@postgres:5432/engines_mk0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: engines_mk0
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command:
      - sh
      - -lc
      - npm run migrate:b5 && npm run migrate:b6 && npm run migrate:b7 && npm run migrate:appointment && npm run migrate:services && npm run mongo:init:b6
    restart: "no"

  worker:
    build:
      context: .
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: engines-mk0-registration
      POSTGRES_URL: postgresql://engines:engines@postgres:5432/engines_mk0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: engines_mk0
      ATTACHMENT_STORE_ROOT: /data/attachments
      ENGINES_WORKER_READY_FILE: /tmp/engines-mk0-worker-ready
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - engines_mk0_attachments:/data/attachments
    command: ["npm", "run", "worker:appointment"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/engines-mk0-worker-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  cta:
    build:
      context: .
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: engines-mk0-registration
      POSTGRES_URL: postgresql://engines:engines@postgres:5432/engines_mk0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: engines_mk0
      ATTACHMENT_STORE_ROOT: /data/attachments
      CORE_HTTP_HOST: 0.0.0.0
      CORE_HTTP_PORT: "8787"
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - engines_mk0_attachments:/data/attachments
    ports:
      - "8787:8787"
    command: ["npm", "run", "cta:http:postman"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  engines_mk0_postgres:
  engines_mk0_mongo:
  engines_mk0_attachments:
