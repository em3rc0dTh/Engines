services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: engines
      MINIO_ROOT_PASSWORD: engines-layer6-secret
    volumes:
      - engines_mk0_objects:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        mc alias set local http://minio:9000 engines engines-layer6-secret &&
        mc mb --ignore-existing local/engines-layer6 &&
        mc anonymous set none local/engines-layer6
    restart: "no"

volumes:
  engines_mk0_objects:
