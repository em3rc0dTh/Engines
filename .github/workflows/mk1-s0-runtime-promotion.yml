name: mk1 S0 runtime promotion certification

on:
  workflow_dispatch:
  push:
    branches:
      - build/mk1-s0-runtime-promotion
    paths:
      - 'mk1/runtime/**'
      - '.github/workflows/mk1-s0-runtime-promotion.yml'

permissions:
  contents: read

concurrency:
  group: mk1-s0-runtime-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-promoted-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Prove promoted tree identity
        working-directory: .
        run: |
          test "$(git rev-parse HEAD:mk0/runtime)" = "$(git rev-parse HEAD:mk1/runtime)"
          echo "MK1_RUNTIME_TREE_IDENTITY_PASS $(git rev-parse HEAD:mk1/runtime)"

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check runtime
        run: npm run check

      - name: Run frozen fast regression surface
        run: |
          npm run test:b1
          npm run test:b3
          npm run test:b7
          npm run test:lab-console
          npm run test:appointment

      - name: Start clean Compose laboratory from promoted path
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d
          docker compose ps

      - name: Wait for CTA health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              curl -fsS http://127.0.0.1:8787/health
              exit 0
            fi
            sleep 1
          done
          docker compose ps -a
          docker compose logs worker cta temporal migrate
          exit 1

      - name: Certify promoted B7 attachment cases
        run: bash scripts/b7-compose-certification.sh

      - name: Certify promoted contact boundary
        run: npx tsx scripts/certify-contact-input-validation.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Certify promoted trace/finalization
        run: npx tsx scripts/certify-lab-console-trace.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Certify promoted phone slot ordering
        run: npx tsx scripts/certify-phone-slot-order.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Certify promoted appointment specimen
        run: npx tsx scripts/certify-register-new-appointment.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Capture S0 evidence
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/mk1-s0
          git rev-parse HEAD > /tmp/mk1-s0/git-sha.txt
          git rev-parse HEAD:mk0/runtime > /tmp/mk1-s0/mk0-runtime-tree.txt
          git rev-parse HEAD:mk1/runtime > /tmp/mk1-s0/mk1-runtime-tree.txt
          cd mk1/runtime
          docker compose ps -a > /tmp/mk1-s0/compose-ps.txt || true
          docker compose logs worker > /tmp/mk1-s0/worker.log 2>&1 || true
          docker compose logs cta > /tmp/mk1-s0/cta.log 2>&1 || true
          docker compose logs temporal > /tmp/mk1-s0/temporal.log 2>&1 || true
          docker compose logs postgres > /tmp/mk1-s0/postgres.log 2>&1 || true
          docker compose logs mongo > /tmp/mk1-s0/mongo.log 2>&1 || true

      - name: Upload S0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-s0-runtime-promotion-${{ github.run_id }}
          path: /tmp/mk1-s0
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
