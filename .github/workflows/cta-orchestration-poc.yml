name: CTA Orchestration Appointment PoC

on:
  push:
    branches:
      - feature/cta-orchestration-register-appointment-poc
  pull_request:
    branches:
      - build/mk1-customer-channels-integrated

permissions:
  contents: read

jobs:
  deterministic-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: CTA compatibility, routing and provider adapters
        run: npm run test:cta:poc
      - name: Existing adapter regressions
        run: |
          npm run test:channel:c1b
          npx tsx --test src/cta/telegram/telegram.adapter.test.ts src/cta/whatsapp/whatsapp.adapter.test.ts src/cta/webchat/webchat.adapter.test.ts

      - name: Start clean Temporal and persistence stack
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d postgres mongo temporal migrate worker cta channel-core
          docker compose ps

      - name: Certify CTA to Temporal to persistence graph
        run: |
          docker compose run --rm --no-deps -T \
            -e ENGINES_CHANNEL_URL=http://channel-core:8788 \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npm run probe:cta:poc | tee /tmp/cta-orchestration-poc.log
          grep -F 'CTA_ORCHESTRATION_POC_PASS' /tmp/cta-orchestration-poc.log

      - name: Capture persistence evidence
        if: always()
        run: |
          mkdir -p /tmp/cta-orchestration-evidence
          cp /tmp/cta-orchestration-poc.log /tmp/cta-orchestration-evidence/ 2>/dev/null || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT event_id,status,workflow_id,case_id,appointment_id,duplicate_count FROM cta_ingress_records ORDER BY created_at" \
            > /tmp/cta-orchestration-evidence/cta-ingress.txt 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT resource_reservation_id,status,case_id,appointment_id,release_reason FROM resource_reservations ORDER BY created_at" \
            > /tmp/cta-orchestration-evidence/resource-reservations.txt 2>&1 || true
          git rev-parse HEAD > /tmp/cta-orchestration-evidence/git-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-orchestration-poc-${{ github.run_id }}
          path: /tmp/cta-orchestration-evidence
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
