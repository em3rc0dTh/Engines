name: MK1 C2/C4 Local Interactive E2E

on:
  push:
    branches:
      - build/mk1-c2-c4-local-interactive-e2e
  pull_request:
    branches:
      - build/mk1-c4-whatsapp-register-customer

permissions:
  contents: read

jobs:
  local-interactive-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run check

      - name: Customer + channel regressions
        run: |
          npm run test:b1
          npm run test:channel:c1b
          npx tsx --test src/cta/telegram/telegram.adapter.test.ts src/cta/whatsapp/whatsapp.adapter.test.ts

      - name: Start clean Engines infrastructure
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d postgres mongo temporal migrate worker
          docker compose ps

      - name: Telegram interactive smoke
        shell: bash
        run: |
          set -o pipefail
          printf '1\n1\nCI Telegram\n1\nci.telegram@example.com\n' \
            | docker compose run --rm -T messaging-lab \
            | tee /tmp/c2-telegram-interactive.log
          grep -F 'MESSAGING_LOCAL_E2E_PASS' /tmp/c2-telegram-interactive.log
          grep -F '"channel":"TELEGRAM"' /tmp/c2-telegram-interactive.log

      - name: WhatsApp interactive smoke
        shell: bash
        run: |
          set -o pipefail
          printf '2\n1\nCI WhatsApp\nci.whatsapp@example.com\n' \
            | docker compose run --rm -T messaging-lab \
            | tee /tmp/c4-whatsapp-interactive.log
          grep -F 'MESSAGING_LOCAL_E2E_PASS' /tmp/c4-whatsapp-interactive.log
          grep -F '"channel":"WHATSAPP"' /tmp/c4-whatsapp-interactive.log
          if grep -F '¿Cuál es tu teléfono?' /tmp/c4-whatsapp-interactive.log; then
            echo 'WhatsApp incorrectly requested a phone already supplied by verified transport.' >&2
            exit 1
          fi

      - name: Capture durable projections
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/c2-c4-evidence
          cp /tmp/c2-telegram-interactive.log /tmp/c2-c4-evidence/ 2>/dev/null || true
          cp /tmp/c4-whatsapp-interactive.log /tmp/c2-c4-evidence/ 2>/dev/null || true
          docker compose ps > /tmp/c2-c4-evidence/compose-ps.txt || true
          docker compose logs worker > /tmp/c2-c4-evidence/worker.log 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT business_slug, channel, external_conversation_id, workflow_id, operation, binding_status FROM channel_conversation_bindings ORDER BY created_at;" \
            > /tmp/c2-c4-evidence/channel-bindings.txt 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT business_slug, channel, external_message_id, status, error_code FROM channel_inbound_events ORDER BY created_at;" \
            > /tmp/c2-c4-evidence/channel-events.txt 2>&1 || true
          printf '%s\n' "${GITHUB_SHA}" > /tmp/c2-c4-evidence/git-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-c2-c4-local-interactive-e2e-${{ github.run_id }}
          path: /tmp/c2-c4-evidence
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
