name: MK1 C4P Kapso Official WhatsApp Transport

on:
  push:
    branches:
      - build/mk1-c4p-kapso-official
  pull_request:
    paths:
      - 'mk1/runtime/src/cta/whatsapp/**'
      - 'mk1/runtime/src/cta/channel-core/**'
      - 'mk1/runtime/package.json'
      - 'mk1/runtime/docker-compose.yml'
      - '.github/workflows/mk1-c4p-kapso-official.yml'

jobs:
  c4p-kapso-official:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install
        working-directory: mk1/runtime
        run: npm ci

      - name: TypeScript
        working-directory: mk1/runtime
        run: npm run check

      - name: Kapso v2 deterministic contract tests
        working-directory: mk1/runtime
        run: npm run test:whatsapp:kapso | tee /tmp/c4p-kapso-tests.log

      - name: WhatsApp adapter regression
        working-directory: mk1/runtime
        run: npx tsx --test src/cta/whatsapp/whatsapp.adapter.test.ts | tee /tmp/c4p-kapso-adapter-tests.log

      - name: Start clean Engines infrastructure
        working-directory: mk1/runtime
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d postgres mongo temporal migrate worker
          docker compose build messaging-lab whatsapp-kapso
          docker compose ps

      - name: Existing real-Temporal WhatsApp regression
        working-directory: mk1/runtime
        run: |
          set -o pipefail
          docker compose run --rm --no-deps -T \
            -e ENGINES_MESSAGING_LAB_SCRIPT=WHATSAPP \
            messaging-lab \
            | tee /tmp/c4p-kapso-local-e2e.log
          grep -F 'MESSAGING_LOCAL_E2E_PASS' /tmp/c4p-kapso-local-e2e.log
          grep -F '"channel":"WHATSAPP"' /tmp/c4p-kapso-local-e2e.log
          grep -F '"phonePrefilled":true' /tmp/c4p-kapso-local-e2e.log
          grep -F '"agent":false' /tmp/c4p-kapso-local-e2e.log
          grep -F '"mcp":false' /tmp/c4p-kapso-local-e2e.log

      - name: Boot Kapso physical runner with deterministic local configuration
        working-directory: mk1/runtime
        env:
          KAPSO_API_KEY: ci-kapso-api-key
          KAPSO_WEBHOOK_SECRET: ci-kapso-webhook-secret
          KAPSO_PHONE_NUMBER_ID: '123456789012345'
          KAPSO_GRAPH_API_VERSION: v24.0
        run: |
          docker compose --profile kapso up --build -d whatsapp-kapso
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8791/health > /tmp/c4p-kapso-health.json; then break; fi
            sleep 1
          done
          grep -F '"provider":"KAPSO"' /tmp/c4p-kapso-health.json
          docker compose logs whatsapp-kapso | tee /tmp/c4p-kapso-runner.log
          grep -F 'WHATSAPP_KAPSO_READY' /tmp/c4p-kapso-runner.log

      - name: Capture deterministic evidence
        if: always()
        working-directory: mk1/runtime
        run: |
          mkdir -p /tmp/c4p-kapso-evidence
          cp /tmp/c4p-kapso-tests.log /tmp/c4p-kapso-evidence/ 2>/dev/null || true
          cp /tmp/c4p-kapso-adapter-tests.log /tmp/c4p-kapso-evidence/ 2>/dev/null || true
          cp /tmp/c4p-kapso-local-e2e.log /tmp/c4p-kapso-evidence/ 2>/dev/null || true
          cp /tmp/c4p-kapso-health.json /tmp/c4p-kapso-evidence/ 2>/dev/null || true
          cp /tmp/c4p-kapso-runner.log /tmp/c4p-kapso-evidence/ 2>/dev/null || true
          docker compose ps > /tmp/c4p-kapso-evidence/compose-ps.txt 2>&1 || true
          docker compose logs worker > /tmp/c4p-kapso-evidence/worker.log 2>&1 || true
          printf '%s\n' "${GITHUB_SHA}" > /tmp/c4p-kapso-evidence/git-sha.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk1-c4p-kapso-${{ github.run_id }}
          path: /tmp/c4p-kapso-evidence

      - name: Cleanup
        if: always()
        working-directory: mk1/runtime
        run: docker compose down -v --remove-orphans || true
