name: mk1 S4 Services management certification

on:
  workflow_dispatch:
  push:
    branches:
      - build/mk1-s4-services-management
    paths:
      - 'mk1/runtime/**'
      - '.github/workflows/mk1-s4-services-management.yml'

permissions:
  contents: read

concurrency:
  group: mk1-s4-services-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-services-s4:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check runtime
        run: npm run check

      - name: Services S1-S4 contract regression
        run: |
          npm run test:services:s1
          npm run test:services:s2
          npm run test:services:s3
          npm run test:services:s4

      - name: Frozen regression subset
        run: |
          npm run test:b1
          npm run test:b3
          npm run test:b7
          npm run test:appointment

      - name: Start clean Compose laboratory
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d
          docker compose ps

      - name: Wait for CTA health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              curl -fsS http://127.0.0.1:8787/health
              exit 0
            fi
            sleep 1
          done
          docker compose ps -a
          docker compose logs worker cta temporal migrate
          exit 1

      - name: Certify S3 recommendation regression
        run: docker compose exec -T worker npm run probe:services:s3

      - name: Certify S4 Temporal management semantics
        run: docker compose exec -T worker npm run probe:services:s4

      - name: Certify inherited Appointment behavior
        run: npx tsx scripts/certify-register-new-appointment.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Capture S4 evidence
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/mk1-s4
          git rev-parse HEAD > /tmp/mk1-s4/git-sha.txt
          cd mk1/runtime
          docker compose ps -a > /tmp/mk1-s4/compose-ps.txt || true
          docker compose logs migrate > /tmp/mk1-s4/migrate.log 2>&1 || true
          docker compose logs worker > /tmp/mk1-s4/worker.log 2>&1 || true
          docker compose logs cta > /tmp/mk1-s4/cta.log 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT operation,business_slug,entity_type,entity_id,status FROM service_mutation_commands ORDER BY created_at;" \
            > /tmp/mk1-s4/postgres-service-mutation-commands.txt 2>&1 || true
          docker compose exec -T mongo mongosh --quiet engines_mk0 --eval \
            'printjson(db.services_mutation_audit.find({}, {_id:0, workflowId:1, businessSlug:1, operation:1, outcomeStatus:1, outcomeCode:1}).toArray())' \
            > /tmp/mk1-s4/mongo-services-audit.txt 2>&1 || true

      - name: Upload S4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-s4-services-management-${{ github.run_id }}
          path: /tmp/mk1-s4
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
