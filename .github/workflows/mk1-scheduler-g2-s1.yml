name: MK1 Scheduler G2-S1 Resource Management

on:
  workflow_dispatch:
  push:
    branches:
      - build/g2-s1-scheduler-management
    paths:
      - 'mk1/runtime/src/contracts/scheduler-engine/**'
      - 'mk1/runtime/src/persistence/postgres/scheduler-management.repository.ts'
      - 'mk1/runtime/scripts/certify-scheduler-g2-s1.ts'
      - 'mk1/runtime/scripts/verify-scheduler-certification-ledger.ts'
      - 'mk1/Test/g2-scheduler-engine-s1.md'
      - 'mk1/Test/g2-scheduler-certification-ledger.json'
      - 'mk1/Test/g2-scheduler-certification-policy.md'
      - 'mk1/Plan/04-platform-steps-3-4-5-roadmap.md'
      - '.github/workflows/mk1-scheduler-g2-s1.yml'
  pull_request:
    branches:
      - build/g2-s0-scheduler-contract-persistence

permissions:
  contents: read

concurrency:
  group: mk1-scheduler-g2-s1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-boundaries:
    name: g2-s1-contracts-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Scheduler sequential certification policy
        run: npx tsx scripts/verify-scheduler-certification-ledger.ts
      - name: G2-S0 predecessor contract regression
        run: npm run test:scheduler:g2:s0
      - name: Protected platform regressions
        run: |
          npm run test:appointment
          npm run test:services:s4
          npm run test:cta:poc
      - name: Guard Scheduler management from provider-specific logic
        run: |
          matches="$(grep -nEi 'telegram|whatsapp|tiktok|webchat|kapso|messenger|facebook' \
            src/contracts/scheduler-engine/management.ts \
            src/persistence/postgres/scheduler-management.repository.ts || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Provider-specific logic leaked into Scheduler G2-S1.'
            exit 1
          fi
          echo 'SCHEDULER_G2_S1_PROVIDER_AGNOSTIC_PASS'
      - name: Guard Appointment from premature Scheduler integration
        run: |
          matches="$(grep -nEi 'scheduler-engine|schedulerManagement|scheduler_' \
            src/orchestration/temporal/workflows/register-new-appointment.workflow.ts \
            src/orchestration/temporal/activities/appointment.activities.ts || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Appointment must remain off Scheduler until G2-S3 is certified.'
            exit 1
          fi
          echo 'SCHEDULER_G2_S1_NO_APPOINTMENT_REWRITE_PASS'
      - name: Terminal contract marker
        run: echo 'SCHEDULER_G2_S1_CONTRACTS_PASS'

  postgres-management:
    name: g2-s1-postgres-management
    needs: contracts-and-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Start clean PostgreSQL + MongoDB
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d postgres mongo
      - name: Apply full migration chain
        run: docker compose run --rm migrate | tee /tmp/g2-s1-migrate.log
      - name: Re-certify G2-S0 persistence predecessor
        run: |
          docker compose run --rm --no-deps -T \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npm run probe:scheduler:g2:s0 | tee /tmp/g2-s1-s0-regression.log
          grep -F 'SCHEDULER_G2_S0_CONTRACT_PERSISTENCE_PASS' /tmp/g2-s1-s0-regression.log
          echo 'SCHEDULER_G2_S1_PREDECESSOR_REGRESSION_PASS'
      - name: Certify resource capability schedule management
        run: |
          docker compose run --rm --no-deps -T \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npx tsx scripts/certify-scheduler-g2-s1.ts | tee /tmp/g2-s1-management.log
          grep -F 'SCHEDULER_G2_S1_MANAGEMENT_PASS' /tmp/g2-s1-management.log
      - name: Start inherited runtime
        run: |
          docker compose up --build -d temporal worker cta channel-core
          for attempt in $(seq 1 75); do
            if curl -fsS http://localhost:8788/health >/tmp/g2-s1-channel-health.json; then
              if grep -Fq '"ok":true' /tmp/g2-s1-channel-health.json; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker compose ps -a
          docker compose logs worker cta channel-core temporal migrate
          exit 1
      - name: Re-certify inherited CTA orchestration path
        run: |
          docker compose run --rm --no-deps -T \
            -e ENGINES_CHANNEL_URL=http://channel-core:8788 \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npm run probe:cta:poc | tee /tmp/g2-s1-cta-regression.log
          grep -F 'CTA_ORCHESTRATION_POC_PASS' /tmp/g2-s1-cta-regression.log
          echo 'SCHEDULER_G2_S1_PLATFORM_REGRESSION_PASS'
      - name: Capture G2-S1 evidence
        if: always()
        run: |
          mkdir -p /tmp/g2-s1-evidence
          git rev-parse HEAD > /tmp/g2-s1-evidence/git-sha.txt
          cp /tmp/g2-s1-migrate.log /tmp/g2-s1-evidence/ 2>/dev/null || true
          cp /tmp/g2-s1-s0-regression.log /tmp/g2-s1-evidence/ 2>/dev/null || true
          cp /tmp/g2-s1-management.log /tmp/g2-s1-evidence/ 2>/dev/null || true
          cp /tmp/g2-s1-cta-regression.log /tmp/g2-s1-evidence/ 2>/dev/null || true
          cp /tmp/g2-s1-channel-health.json /tmp/g2-s1-evidence/ 2>/dev/null || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT business_slug,resource_id,resource_code,status,capacity,revision FROM scheduler_resources ORDER BY business_slug,resource_id;" \
            > /tmp/g2-s1-evidence/resources.txt 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT business_slug,schedule_id,resource_id,revision FROM scheduler_schedule_templates ORDER BY business_slug,schedule_id;" \
            > /tmp/g2-s1-evidence/schedules.txt 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT business_slug,operation_id,command_type,material_hash,result_type,result_id FROM scheduler_commands ORDER BY business_slug,operation_id;" \
            > /tmp/g2-s1-evidence/commands.txt 2>&1 || true
      - name: Upload G2-S1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-g2-s1-${{ github.run_id }}
          path: /tmp/g2-s1-evidence
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true

  scheduler-g2-s1-seal:
    name: scheduler-g2-s1-seal
    needs:
      - contracts-and-boundaries
      - postgres-management
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build G2-S1 receipt
        run: |
          mkdir -p /tmp/g2-s1-seal
          git rev-parse HEAD | tee /tmp/g2-s1-seal/git-sha.txt
          cat > /tmp/g2-s1-seal/certification.txt <<'EOF'
          G2-S0 predecessor regression               PASS
          Resource create/update versioning          PASS
          Capability replacement management          PASS
          Resource status revision control           PASS
          Schedule template versioning               PASS
          Schedule override create/update/delete     PASS
          Same-material command replay               PASS
          Material-conflict rejection                PASS
          Cross-business mutation isolation          PASS
          Appointment remains pre-Scheduler          PASS
          EOF
          echo 'SCHEDULER_G2_S1_CERTIFICATION_PASS' | tee /tmp/g2-s1-seal/terminal-marker.txt
      - name: Upload G2-S1 seal
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-g2-s1-seal-${{ github.run_id }}
          path: /tmp/g2-s1-seal
          if-no-files-found: error
      - name: Terminal certification marker
        run: echo 'SCHEDULER_G2_S1_CERTIFICATION_PASS'
