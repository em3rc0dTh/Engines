name: MK1 ME1 Managed Entity Resolution

on:
  push:
    branches:
      - feature/managed-entity-resolution-policy
  pull_request:
    branches:
      - developer

permissions:
  contents: read

jobs:
  contract-persistence-and-webchat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/managed-entity-me1-tsc.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Managed Entity policy and Appointment contract tests
        run: npm run test:appointment

      - name: WebChat and channel regression
        run: npm run test:channel:c1b

      - name: Start clean persistence, Temporal, and physical WebChat surface
        run: |
          docker compose --profile webchat down -v --remove-orphans || true
          docker compose --profile webchat up --build -d
          docker compose --profile webchat ps
          curl --retry 20 --retry-delay 1 --retry-all-errors -fsS \
            http://127.0.0.1:8790/health | tee /tmp/managed-entity-me1-webchat-health.json
          grep -F '"ok":true' /tmp/managed-entity-me1-webchat-health.json
          grep -F '"agent":false' /tmp/managed-entity-me1-webchat-health.json
          grep -F '"mcp":false' /tmp/managed-entity-me1-webchat-health.json

      - name: Prepare deterministic physical fixtures
        run: |
          docker compose run --rm --no-deps -T \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npm run fixture:me1:physical | tee /tmp/managed-entity-me1-physical-fixtures.log
          grep -F 'ME1_PHYSICAL_FIXTURES_READY' /tmp/managed-entity-me1-physical-fixtures.log

      - name: Certify Managed Entity persistence semantics
        run: |
          docker compose run --rm --no-deps -T \
            -e POSTGRES_URL=postgresql://engines:engines@postgres:5432/engines_mk0 \
            cta npm run probe:managed-entity | tee /tmp/managed-entity-me1.log
          grep -F 'MANAGED_ENTITY_ME1_PERSISTENCE_PASS' /tmp/managed-entity-me1.log

      - name: Capture ME1 evidence
        if: always()
        run: |
          mkdir -p /tmp/managed-entity-me1-evidence
          cp /tmp/managed-entity-me1-tsc.log /tmp/managed-entity-me1-evidence/ 2>/dev/null || true
          cp /tmp/managed-entity-me1.log /tmp/managed-entity-me1-evidence/ 2>/dev/null || true
          cp /tmp/managed-entity-me1-physical-fixtures.log /tmp/managed-entity-me1-evidence/ 2>/dev/null || true
          cp /tmp/managed-entity-me1-webchat-health.json /tmp/managed-entity-me1-evidence/ 2>/dev/null || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT managed_entity_id,business_slug,customer_id,entity_type,display_name,external_ref,status FROM managed_entities ORDER BY created_at" \
            > /tmp/managed-entity-me1-evidence/managed-entities.txt 2>&1 || true
          git rev-parse HEAD > /tmp/managed-entity-me1-evidence/git-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-me1-managed-entity-${{ github.run_id }}
          path: /tmp/managed-entity-me1-evidence
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: docker compose --profile webchat down -v --remove-orphans || true
