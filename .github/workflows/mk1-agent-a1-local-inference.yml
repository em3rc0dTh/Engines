name: MK1 Agent Layer A1 Local Inference

on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-layer-a1-local-inference
    paths:
      - 'mk1/runtime/src/agent/**'
      - 'mk1/runtime/src/contracts/agent-layer/**'
      - 'mk1/runtime/scripts/certify-agent-a1-real-local.ts'
      - 'mk1/runtime/package.json'
      - 'mk1/Design/18-agent-layer-a1-local-inference.md'
      - 'mk1/Plan/17-agent-layer-a1-local-inference.md'
      - 'mk1/Test/agent-layer-a1-local-inference.md'
      - 'mk1/Build/README.md'
      - 'mk1/Build/evidence/README.md'
      - 'mk1/Build/evidence/agent-layer-a1-real-local-inference-certification-2026-09-22.md'
      - '.github/workflows/mk1-agent-a1-local-inference.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mk1-agent-a1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-provider-contract:
    name: deterministic-provider-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mk1/runtime
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run check | tee /tmp/agent-a1-typescript.log

      - name: A0 contract regression
        run: npm run test:agent:a0 | tee /tmp/agent-a1-a0.log

      - name: A1 provider contract tests
        run: npm run test:agent:a1 | tee /tmp/agent-a1-provider.log

      - name: Capture deterministic evidence
        if: always()
        run: |
          mkdir -p /tmp/agent-a1-deterministic
          git rev-parse HEAD > /tmp/agent-a1-deterministic/git-sha.txt
          cp /tmp/agent-a1-*.log /tmp/agent-a1-deterministic/ 2>/dev/null || true

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-agent-a1-deterministic-${{ github.run_id }}
          path: /tmp/agent-a1-deterministic
          if-no-files-found: error

  real-local-inference:
    name: real-local-inference
    needs: deterministic-provider-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mk1/runtime
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev

      - name: Build pinned llama.cpp CPU server
        run: |
          rm -rf /tmp/llama.cpp
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp fetch --depth 1 origin b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          git -C /tmp/llama.cpp checkout --detach b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -G Ninja             -DGGML_NATIVE=OFF             -DGGML_OPENMP=ON             -DGGML_CUDA=OFF             -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j 2
          /tmp/llama.cpp/build/bin/llama-server --version | tee /tmp/agent-a1-llama-version.log

      - name: Download official Qwen 1.5B Q4_K_M candidate
        run: |
          mkdir -p /tmp/agent-model
          curl -L --fail --retry 5 --retry-delay 2             -o /tmp/agent-model/qwen2.5-1.5b-instruct-q4_k_m.gguf             https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          stat -c '%s' /tmp/agent-model/qwen2.5-1.5b-instruct-q4_k_m.gguf | tee /tmp/agent-a1-model-size-bytes.txt
          sha256sum /tmp/agent-model/qwen2.5-1.5b-instruct-q4_k_m.gguf | tee /tmp/agent-a1-model-sha256.txt
          size=$(cat /tmp/agent-a1-model-size-bytes.txt)
          test "$size" -gt 900000000
          test "$size" -lt 1400000000

      - name: Start constrained local inference server
        run: |
          /tmp/llama.cpp/build/bin/llama-server             -m /tmp/agent-model/qwen2.5-1.5b-instruct-q4_k_m.gguf             --alias engines-agent-local             --host 127.0.0.1             --port 8080             --threads 4             --threads-batch 4             --ctx-size 4096             --parallel 1             --predict 128             --batch-size 256             --ubatch-size 128             --no-mmproj             > /tmp/agent-a1-llama-server.log 2>&1 &
          echo $! > /tmp/agent-a1-llama.pid

          pid=$(cat /tmp/agent-a1-llama.pid)
          echo 0 > /tmp/agent-a1-max-rss-kb.txt
          (
            while kill -0 "$pid" 2>/dev/null; do
              rss=$(awk '/VmRSS:/ {print $2}' "/proc/$pid/status" 2>/dev/null || echo 0)
              old=$(cat /tmp/agent-a1-max-rss-kb.txt 2>/dev/null || echo 0)
              if [ "${rss:-0}" -gt "${old:-0}" ]; then
                echo "$rss" > /tmp/agent-a1-max-rss-kb.txt
              fi
              sleep 0.2
            done
          ) &
          echo $! > /tmp/agent-a1-monitor.pid

          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/agent-a1-health.json 2>/dev/null; then
              cat /tmp/agent-a1-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/agent-a1-llama-server.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/agent-a1-llama-server.log
          exit 1

      - name: Execute real local conversational golden slice
        env:
          AGENT_LLAMA_BASE_URL: http://127.0.0.1:8080
          AGENT_LLAMA_MODEL: engines-agent-local
          AGENT_DEBUG_MODEL_OUTPUT: '1'
        run: |
          npm run probe:agent:a1:local | tee /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_REAL_LOCAL_MODEL_PASS' /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_SCHEMA_CONSTRAINED_OUTPUT_PASS' /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_GOLDEN_CONVERSATION_PASS' /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_ENGINE_ACTION_MAPPING_PASS' /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_LATENCY_MEASURED_PASS' /tmp/agent-a1-real-local.log
          grep -F 'AGENT_A1_CERTIFICATION_PASS' /tmp/agent-a1-real-local.log

      - name: Enforce inference memory envelope
        run: |
          sleep 1
          max_rss_kb=$(cat /tmp/agent-a1-max-rss-kb.txt)
          echo "max_rss_kb=$max_rss_kb" | tee /tmp/agent-a1-resource-gate.txt
          echo "max_rss_mb=$((max_rss_kb / 1024))" | tee -a /tmp/agent-a1-resource-gate.txt
          echo "threads=4" | tee -a /tmp/agent-a1-resource-gate.txt
          echo "context_tokens=4096" | tee -a /tmp/agent-a1-resource-gate.txt
          echo "parallel_generations=1" | tee -a /tmp/agent-a1-resource-gate.txt
          echo "host_mem_total_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" | tee -a /tmp/agent-a1-resource-gate.txt
          test "$max_rss_kb" -gt 0
          test "$max_rss_kb" -le 2359296
          echo 'AGENT_A1_INFERENCE_RSS_BUDGET_PASS' | tee -a /tmp/agent-a1-resource-gate.txt

      - name: Capture real-model evidence
        if: always()
        run: |
          mkdir -p /tmp/agent-a1-real-evidence
          git rev-parse HEAD > /tmp/agent-a1-real-evidence/git-sha.txt
          git -C /tmp/llama.cpp rev-parse HEAD > /tmp/agent-a1-real-evidence/llama-cpp-sha.txt 2>/dev/null || true
          nproc > /tmp/agent-a1-real-evidence/host-nproc.txt
          grep MemTotal /proc/meminfo > /tmp/agent-a1-real-evidence/host-memory.txt
          cp /tmp/agent-a1-llama-version.log /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-model-size-bytes.txt /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-model-sha256.txt /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-health.json /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-real-local.log /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-resource-gate.txt /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-max-rss-kb.txt /tmp/agent-a1-real-evidence/ 2>/dev/null || true
          cp /tmp/agent-a1-llama-server.log /tmp/agent-a1-real-evidence/ 2>/dev/null || true

      - name: Upload real-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-agent-a1-real-local-${{ github.run_id }}
          path: /tmp/agent-a1-real-evidence
          if-no-files-found: error

      - name: Cleanup local model
        if: always()
        run: |
          if [ -f /tmp/agent-a1-monitor.pid ]; then
            kill "$(cat /tmp/agent-a1-monitor.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/agent-a1-llama.pid ]; then
            kill "$(cat /tmp/agent-a1-llama.pid)" 2>/dev/null || true
          fi

  protected-pre-agent-regressions:
    name: protected-pre-agent-regressions
    needs: deterministic-provider-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mk1/runtime
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json
      - run: npm ci
      - run: npm run test:appointment
      - run: npm run test:channel:c0
      - run: npm run test:scheduler:g2:s0
      - run: npm run test:integration:g3:i0
      - run: echo 'AGENT_A1_PRE_AGENT_REGRESSIONS_PASS'

  agent-a1-seal:
    name: agent-a1-seal
    needs:
      - real-local-inference
      - protected-pre-agent-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Build exact-head A1 seal
        shell: bash
        run: |
          mkdir -p /tmp/agent-a1-seal
          git rev-parse HEAD | tee /tmp/agent-a1-seal/git-sha.txt
          cat > /tmp/agent-a1-seal/certification.txt <<'EOF'
          A0 contract preserved                         PASS
          llama.cpp real local runtime                  PASS
          Qwen2.5 1.5B Instruct Q4_K_M                  PASS
          JSON-schema constrained output                PASS
          Spanish conversational golden slice           PASS
          canonical id preservation                     PASS
          Engine allowed-action boundary                PASS
          measured local inference latency              PASS
          inference RSS <= 2304 MB                      PASS
          4-thread / 4k-context / single-slot profile   PASS
          protected PRE-AGENT regressions               PASS
          EOF
          echo 'AGENT_A1_SEAL_PASS' | tee /tmp/agent-a1-seal/terminal-marker.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mk1-agent-a1-seal-${{ github.run_id }}
          path: /tmp/agent-a1-seal
          if-no-files-found: error

      - name: Terminal A1 marker
        run: echo 'AGENT_A1_SEAL_PASS'
