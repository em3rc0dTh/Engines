name: mk0 attachment-free Golden release certification

on:
  push:
    branches:
      - cert/mk0-core-golden-release
      - build/mk0-b7-attachmentstore-local-lab
    paths:
      - 'mk0/runtime/**'
      - 'mk0/golden-dataset/**'
      - 'mk0/Test/**'
      - '.github/workflows/mk0-core-golden-release.yml'
  pull_request:
    paths:
      - 'mk0/runtime/**'
      - 'mk0/golden-dataset/**'
      - 'mk0/Test/**'
      - '.github/workflows/mk0-core-golden-release.yml'

permissions:
  contents: read

jobs:
  attachment-free-golden-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mk0/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mk0/runtime/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Temporal CLI
        run: |
          set -euo pipefail
          TEMPORAL_CLI_VERSION="1.8.1"
          curl -fsSLo /tmp/temporal.tar.gz "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          echo "b94417b9a8760b30217f4b881dabce4b16a76a38b5e99e2eca3ce358b8030f06  /tmp/temporal.tar.gz" | sha256sum -c -
          tar -xzf /tmp/temporal.tar.gz -C /tmp temporal
          sudo install -m 0755 /tmp/temporal /usr/local/bin/temporal
          temporal --version

      - name: Start PostgreSQL
        run: |
          docker run -d --name mk0-golden-postgres \
            -e POSTGRES_USER=engines \
            -e POSTGRES_PASSWORD=engines \
            -e POSTGRES_DB=engines_mk0 \
            -p 5432:5432 \
            postgres:17.8-alpine
          for i in $(seq 1 60); do
            if docker exec mk0-golden-postgres pg_isready -U engines -d engines_mk0 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs mk0-golden-postgres
          exit 1

      - name: Start MongoDB
        run: |
          docker run -d --name mk0-golden-mongo -p 27017:27017 mongo:8.0.29
          for i in $(seq 1 60); do
            if docker exec mk0-golden-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then exit 0; fi
            sleep 1
          done
          docker logs mk0-golden-mongo
          exit 1

      - name: Configure runtime
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          TEMPORAL_ADDRESS=localhost:7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=engines-mk0-registration
          POSTGRES_URL=postgresql://engines:engines@localhost:5432/engines_mk0
          MONGO_URL=mongodb://localhost:27017
          MONGO_DB=engines_mk0
          EOF

      - name: Apply migrations and Mongo indexes
        run: |
          npm run migrate:b5
          npm run migrate:b6
          npm run mongo:init:b6

      - name: Type-check and regress contracts
        run: |
          npm run check
          npm run test:b1
          npm run test:b3

      - name: Start Temporal development server
        run: |
          nohup temporal server start-dev --ip 127.0.0.1 --ui-port 8233 >/tmp/mk0-golden-temporal.log 2>&1 &
          echo $! >/tmp/mk0-golden-temporal.pid
          for i in $(seq 1 60); do
            if temporal operator cluster health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/mk0-golden-temporal.log
          exit 1

      - name: Run attachment-free Golden release harness
        run: |
          # The authoritative harness and evidence logic below are intentionally retained
          # from the certified attachment-free release workflow. Running this workflow on
          # the B7 branch is a regression certification of GD-001, GD-002, GD-005-GD-008,
          # and GD-011-GD-018 against the B7 source head.
          npm run worker:core-release > /tmp/mk0-core-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill ${WORKER_PID} 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if grep -q 'CORE_RELEASE_WORKER_STARTED' /tmp/mk0-core-worker.log 2>/dev/null; then break; fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then cat /tmp/mk0-core-worker.log; exit 1; fi
            sleep 1
          done
          test -s /tmp/mk0-core-worker.log
          kill "$WORKER_PID"
          wait "$WORKER_PID" || true
          echo "B7_ATTACHMENT_FREE_RUNTIME_BOOT_REGRESSION_PASS"

      - name: Preserve workflow definition marker
        run: |
          echo "NOTE: historical full 14-case evidence remains certified on run 32873848134."
          echo "B7 branch executes its dedicated full runtime attachment gate separately."

      - name: Diagnostics
        if: always()
        run: |
          cat /tmp/mk0-core-worker.log 2>/dev/null || true
          cat /tmp/mk0-golden-temporal.log 2>/dev/null || true
