name: MK1 C4P WhatsApp Cloud API Official Transport

on:
  push:
    branches:
      - build/mk1-c4p-whatsapp-cloud-api-official
  pull_request:
    paths:
      - 'mk1/runtime/src/cta/whatsapp/**'
      - 'mk1/runtime/src/cta/channel-core/**'
      - 'mk1/runtime/package.json'
      - 'mk1/runtime/docker-compose.yml'
      - '.github/workflows/mk1-c4p-whatsapp-cloud-api-official.yml'

jobs:
  c4p-whatsapp-cloud-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install
        working-directory: mk1/runtime
        run: npm ci

      - name: TypeScript
        working-directory: mk1/runtime
        run: npm run check

      - name: Meta Cloud API deterministic contract tests
        working-directory: mk1/runtime
        run: npm run test:whatsapp:cloud-api | tee /tmp/c4p-cloud-api-tests.log

      - name: WhatsApp adapter regression
        working-directory: mk1/runtime
        run: npx tsx --test src/cta/whatsapp/whatsapp.adapter.test.ts | tee /tmp/c4p-adapter-tests.log

      - name: Start clean Engines infrastructure
        working-directory: mk1/runtime
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d postgres mongo temporal migrate worker
          docker compose build messaging-lab whatsapp-cloud-api
          docker compose ps

      - name: Existing real-Temporal WhatsApp regression
        working-directory: mk1/runtime
        run: |
          set -o pipefail
          docker compose run --rm --no-deps -T \
            -e ENGINES_MESSAGING_LAB_SCRIPT=WHATSAPP \
            messaging-lab \
            | tee /tmp/c4p-whatsapp-local-e2e.log
          grep -F 'MESSAGING_LOCAL_E2E_PASS' /tmp/c4p-whatsapp-local-e2e.log
          grep -F '"channel":"WHATSAPP"' /tmp/c4p-whatsapp-local-e2e.log
          grep -F '"phonePrefilled":true' /tmp/c4p-whatsapp-local-e2e.log
          grep -F '"agent":false' /tmp/c4p-whatsapp-local-e2e.log
          grep -F '"mcp":false' /tmp/c4p-whatsapp-local-e2e.log

      - name: Boot official webhook runner with deterministic local configuration
        working-directory: mk1/runtime
        env:
          WHATSAPP_APP_SECRET: ci-app-secret
          WHATSAPP_ACCESS_TOKEN: ci-access-token
          WHATSAPP_PHONE_NUMBER_ID: '1234567890'
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-verify-token
          WHATSAPP_GRAPH_API_VERSION: v99.0
        run: |
          docker compose --profile whatsapp up --build -d whatsapp-cloud-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8790/health > /tmp/c4p-health.json; then break; fi
            sleep 1
          done
          grep -F '"provider":"META_CLOUD_API"' /tmp/c4p-health.json
          test "$(curl -fsS 'http://localhost:8790/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=ci-verify-token&hub.challenge=c4p-ok')" = 'c4p-ok'
          docker compose logs whatsapp-cloud-api | tee /tmp/c4p-runner.log
          grep -F 'WHATSAPP_CLOUD_API_READY' /tmp/c4p-runner.log

      - name: Capture deterministic evidence
        if: always()
        working-directory: mk1/runtime
        run: |
          mkdir -p /tmp/c4p-evidence
          cp /tmp/c4p-cloud-api-tests.log /tmp/c4p-evidence/ 2>/dev/null || true
          cp /tmp/c4p-adapter-tests.log /tmp/c4p-evidence/ 2>/dev/null || true
          cp /tmp/c4p-whatsapp-local-e2e.log /tmp/c4p-evidence/ 2>/dev/null || true
          cp /tmp/c4p-health.json /tmp/c4p-evidence/ 2>/dev/null || true
          cp /tmp/c4p-runner.log /tmp/c4p-evidence/ 2>/dev/null || true
          docker compose ps > /tmp/c4p-evidence/compose-ps.txt 2>&1 || true
          docker compose logs worker > /tmp/c4p-evidence/worker.log 2>&1 || true
          printf '%s\n' "${GITHUB_SHA}" > /tmp/c4p-evidence/git-sha.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk1-c4p-whatsapp-cloud-api-${{ github.run_id }}
          path: /tmp/c4p-evidence

      - name: Cleanup
        if: always()
        working-directory: mk1/runtime
        run: docker compose down -v --remove-orphans || true
