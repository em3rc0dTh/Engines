name: mk1 S5 Services snapshot certification

on:
  workflow_dispatch:
  push:
    branches:
      - build/mk1-s5-services-snapshots
    paths:
      - 'mk1/runtime/**'
      - '.github/workflows/mk1-s5-services-snapshots.yml'

permissions:
  contents: read

concurrency:
  group: mk1-s5-services-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-services-s5:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: mk1/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mk1/runtime/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check runtime
        run: npm run check

      - name: Services S1-S4 regression
        run: |
          npm run test:services:s1
          npm run test:services:s2
          npm run test:services:s3
          npm run test:services:s4

      - name: Frozen regression subset
        run: |
          npm run test:b1
          npm run test:b3
          npm run test:b7
          npm run test:appointment

      - name: Start clean Compose laboratory
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d
          docker compose ps

      - name: Wait for CTA and worker health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null \
              && docker compose exec -T worker test -f /tmp/engines-mk0-worker-ready; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps -a
          docker compose logs worker cta temporal migrate
          exit 1

      - name: Certify S4 management regression
        run: |
          docker compose exec -T worker npm run probe:services:s4
          docker compose exec -T worker npm run probe:services:s4:safety

      - name: Prepare S5 revision-N snapshot and publish N+1
        run: docker compose exec -T worker npm run probe:services:s5:prepare

      - name: Capture worker identity before restart
        run: |
          docker compose exec -T worker cat /tmp/engines-mk0-worker-ready | tee /tmp/s5-worker-before.txt

      - name: Restart Worker while snapshot Workflow is waiting
        run: docker compose restart worker

      - name: Wait for restarted worker
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T worker test -f /tmp/engines-mk0-worker-ready; then
              docker compose exec -T worker cat /tmp/engines-mk0-worker-ready | tee /tmp/s5-worker-after.txt
              if ! cmp -s /tmp/s5-worker-before.txt /tmp/s5-worker-after.txt; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker compose ps -a
          docker compose logs worker
          exit 1

      - name: Complete S5 snapshot experiment after restart
        run: docker compose exec -T worker npm run probe:services:s5:complete

      - name: Certify inherited Appointment behavior
        run: npx tsx scripts/certify-register-new-appointment.ts
        env:
          ENGINES_CTA_URL: http://127.0.0.1:8787

      - name: Capture S5 evidence
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/mk1-s5
          git rev-parse HEAD > /tmp/mk1-s5/git-sha.txt
          cp /tmp/s5-worker-before.txt /tmp/mk1-s5/worker-before.txt 2>/dev/null || true
          cp /tmp/s5-worker-after.txt /tmp/mk1-s5/worker-after.txt 2>/dev/null || true
          cd mk1/runtime
          docker compose ps -a > /tmp/mk1-s5/compose-ps.txt || true
          docker compose logs worker > /tmp/mk1-s5/worker.log 2>&1 || true
          docker compose logs cta > /tmp/mk1-s5/cta.log 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT service_id,service_name,revision,status FROM service_catalog WHERE business_slug='s5-snapshot-business';" \
            > /tmp/mk1-s5/postgres-service-head.txt 2>&1 || true
          docker compose exec -T postgres psql -U engines -d engines_mk0 -c \
            "SELECT product_id,product_name,duration_minutes,price_kind,price_amount_minor,revision,status FROM service_products WHERE business_slug='s5-snapshot-business';" \
            > /tmp/mk1-s5/postgres-offering-head.txt 2>&1 || true
          docker compose exec -T mongo mongosh --quiet engines_mk0 --eval \
            "printjson(db.services_mutation_audit.find({businessSlug:'s5-snapshot-business'}, {_id:0,workflowId:1,operation:1,outcomeStatus:1}).toArray())" \
            > /tmp/mk1-s5/mongo-s5-management-audit.txt 2>&1 || true

      - name: Upload S5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk1-s5-services-snapshots-${{ github.run_id }}
          path: /tmp/mk1-s5
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
