name: mk0 B0 runtime certification

on:
  push:
    branches:
      - build/mk0-b0-runtime-skeleton
    paths:
      - 'mk0/runtime/**'
      - '.github/workflows/mk0-b0-ci.yml'
  pull_request:
    paths:
      - 'mk0/runtime/**'
      - '.github/workflows/mk0-b0-ci.yml'

permissions:
  contents: read

jobs:
  b0-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mk0/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Type-check runtime
        run: npm run check

      - name: Validate Compose model
        run: docker compose config

      - name: Start PostgreSQL and MongoDB
        run: docker compose up -d --wait postgres mongo

      - name: Probe application stores
        run: npm run probe:stores

      - name: Install pinned Temporal CLI 1.8.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo temporal.tar.gz https://github.com/temporalio/cli/releases/download/v1.8.1/temporal_cli_1.8.1_linux_amd64.tar.gz
          echo 'b94417b9a8760b30217f4b881dabce4b16a76a38b5e99e2eca3ce358b8030f06  temporal.tar.gz' | sha256sum -c -
          tar -xzf temporal.tar.gz
          sudo install -m 0755 temporal /usr/local/bin/temporal
          temporal --version

      - name: Start real Temporal dev service
        run: |
          temporal server start-dev --ui-port 8233 > /tmp/mk0-temporal.log 2>&1 &
          echo $! > /tmp/mk0-temporal.pid
          for i in $(seq 1 40); do
            if temporal operator cluster health >/dev/null 2>&1; then
              temporal operator cluster health
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mk0-temporal.log
          exit 1

      - name: Verify Temporal Web UI responds
        run: curl --fail --retry 10 --retry-delay 1 http://localhost:8233/ >/dev/null

      - name: Start B0 Worker
        run: |
          npm run worker:b0 > /tmp/mk0-worker.log 2>&1 &
          echo $! > /tmp/mk0-worker.pid
          for i in $(seq 1 30); do
            if grep -q 'B0_WORKER_STARTED' /tmp/mk0-worker.log; then
              cat /tmp/mk0-worker.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mk0-worker.pid)" 2>/dev/null; then
              cat /tmp/mk0-worker.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/mk0-worker.log
          exit 1

      - name: Execute B0 Temporal smoke Workflow
        run: |
          timeout 60 npm run smoke:b0 | tee /tmp/mk0-smoke.log
          grep -q 'B0_TEMPORAL_SMOKE_OK' /tmp/mk0-smoke.log

      - name: Assert no business schema exists in B0
        run: |
          test ! -d src/domain
          test ! -d src/contracts/register-new-customer

      - name: Capture versions
        if: always()
        run: |
          node --version
          npm --version
          docker --version
          docker compose version
          temporal --version || true

      - name: Diagnostic logs
        if: failure()
        run: |
          echo '--- Temporal ---'
          cat /tmp/mk0-temporal.log || true
          echo '--- Worker ---'
          cat /tmp/mk0-worker.log || true
          echo '--- Compose ---'
          docker compose ps || true
          docker compose logs postgres mongo || true

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/mk0-worker.pid ]; then kill "$(cat /tmp/mk0-worker.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/mk0-temporal.pid ]; then kill "$(cat /tmp/mk0-temporal.pid)" 2>/dev/null || true; fi
          docker compose down -v || true
