services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: engines
      POSTGRES_PASSWORD: engines
      POSTGRES_DB: engines_mk0
    ports:
      - "5432:5432"
    volumes:
      - engines_mk0_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engines -d engines_mk0"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - engines_mk0_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  engines_mk0_postgres:
  engines_mk0_mongo:
